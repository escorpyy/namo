name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: namoerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/namoerp_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations are up to date with the schema code
        run: |
          pnpm exec drizzle-kit generate
          test -z "$(git status --porcelain drizzle)" || { echo "Schema changed without a migration. Run: pnpm db:generate"; git status --porcelain drizzle; exit 1; }
      - name: Apply migrations and seed demo data (test database)
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Type-check and build
        run: pnpm build
      - name: Tests (unit + API integration)
        run: pnpm test
